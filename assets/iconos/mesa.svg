<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Mesa">
  <!-- Mesa. El emoji no tiene ninguna: hasta ahora la palabra MESA se
       ilustraba con una silla 🪑 o con unos cubiertos 🍽️. -->
  <!-- Sombra suave, para que no flote sobre el fondo claro. -->
  <ellipse cx="64" cy="112" rx="42" ry="6" fill="#000" opacity=".08"/>
  <!-- Patas -->
  <rect x="26" y="62" width="11" height="48" rx="5" fill="#a0672f"/>
  <rect x="91" y="62" width="11" height="48" rx="5" fill="#a0672f"/>
  <!-- Travesaño -->
  <rect x="30" y="84" width="68" height="8" rx="4" fill="#b87333"/>
  <!-- Tablero -->
  <rect x="12" y="44" width="104" height="20" rx="8" fill="#d18b47"/>
  <rect x="12" y="44" width="104" height="9" rx="4.5" fill="#e0a05c"/>
</svg>
