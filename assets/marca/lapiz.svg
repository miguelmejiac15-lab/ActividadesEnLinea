<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img"
     aria-label="Actividades en Línea">
    <!--
        El lápiz de la marca.

        Hasta ahora era el emoji ✏️, y un emoji no es un símbolo de marca:
        lo dibuja el sistema de quien mira, así que en un iPhone sale el
        lápiz de Apple, en Android el de Google y en Windows otro. Tres
        marcas distintas para la misma cuenta.

        Es el mismo lápiz de siempre, con las mismas piezas y los mismos
        colores de la plataforma. Solo que ahora se ve igual en todas
        partes.

        Inclinado 32° porque un lápiz recto parece un icono de aplicación
        y uno inclinado parece que está escribiendo.
    -->
    <g transform="rotate(32 24 24)">
        <!-- Goma: morado, el color de «LÍNEA» -->
        <path d="M17 8.5A3.5 3.5 0 0 1 20.5 5h7A3.5 3.5 0 0 1 31 8.5V12H17Z"
              fill="#ab47bc"/>

        <!-- Virola: azul, el color de «ACTIVIDADES» -->
        <rect x="17" y="12" width="14" height="3.4" fill="#29b6f6"/>

        <!-- Cuerpo: naranja, el color de «EN» -->
        <rect x="17" y="15.4" width="14" height="17.6" fill="#ff9800"/>

        <!-- Una franja más clara: le da volumen sin necesitar degradado,
             que a 16 píxeles se convierte en barro. -->
        <rect x="17" y="15.4" width="4.2" height="17.6" fill="#ffb547"/>

        <!-- Madera -->
        <path d="M17 33h14l-5.6 9.4a1.6 1.6 0 0 1-2.8 0Z" fill="#f6d3a3"/>

        <!-- Punta -->
        <path d="M21.3 40.2h5.4l-1.3 2.2a1.6 1.6 0 0 1-2.8 0Z" fill="#2f3b52"/>
    </g>
</svg>
