# =====================================================================
#  Apache · Actividades en Línea
# =====================================================================

<Directory /var/www/html>
    # El proyecto protege carpetas con .htaccess (config/, almacen/,
    # includes/, database/, admin/includes/, escuela/includes/). Con
    # AllowOverride None —el valor por defecto de la imagen php:apache—
    # Apache los ignora en silencio y esas carpetas quedan servidas.
    AllowOverride All
    Options -Indexes +FollowSymLinks
    Require all granted
</Directory>

# ── La IP real del visitante ─────────────────────────────────────────
# Detrás del proxy de Coolify, REMOTE_ADDR es la IP del proxy: la misma
# para todo el mundo. Sin esto, los rechazos de firma del webhook y
# cualquier registro de acceso apuntan siempre a la red interna de
# Docker, y no se puede distinguir un visitante de otro.
#
# Solo se acepta la cabecera si viene de rangos privados, que es por donde
# habla el proxy. Confiarla a cualquiera permitiría a un visitante
# declarar la IP que quisiera.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 10.0.0.0/8
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16
RemoteIPTrustedProxy 127.0.0.0/8

# El registro de acceso con la IP real en vez de la del proxy.
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" ael
CustomLog /dev/stdout ael
ErrorLog /dev/stderr

# ── No anunciar qué servidor y qué versión ───────────────────────────
# «Apache/2.4.58 (Debian) PHP/8.2.12» le dice a un escáner exactamente
# qué vulnerabilidades probar. No es una defensa, pero es gratis.
ServerTokens Prod
ServerSignature Off

# Apache avisa si no puede resolver su propio nombre. En un contenedor no
# puede, y el aviso ensucia el arranque de cada despliegue.
ServerName actividadesenlinea.com
