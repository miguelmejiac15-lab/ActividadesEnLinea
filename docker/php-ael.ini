; =====================================================================
;  PHP · Actividades en Línea (producción)
; =====================================================================

; ── Errores ──────────────────────────────────────────────────────────
; Nunca en pantalla: revelan rutas, consultas y a veces credenciales.
; `config.php` ya lo fija según el entorno, pero si algo fallara ANTES de
; cargarlo —un error de sintaxis, una extensión ausente— esa línea no se
; habría ejecutado todavía y la traza saldría al navegador. Aquí se cierra
; desde el principio.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; A stderr para que los logs salgan por `docker logs` y Coolify los vea.
error_log = /dev/stderr

; ── Sesiones ─────────────────────────────────────────────────────────
; Estas tres las fija también config.php al abrir la sesión. Se repiten
; aquí por si algún script llegara a arrancar una sesión por su cuenta.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; ── No anunciar PHP ──────────────────────────────────────────────────
; Quita la cabecera `X-Powered-By: PHP/8.2.x`.
expose_php = Off

; ── Límites ──────────────────────────────────────────────────────────
; El sitio no recibe archivos de los visitantes: no hace falta margen
; para subidas, y dejarlo alto solo amplía lo que se puede intentar.
upload_max_filesize = 2M
post_max_size = 4M
max_execution_time = 30
memory_limit = 128M

; ── OPcache ──────────────────────────────────────────────────────────
; Compila el PHP una vez y lo guarda en memoria. En una t3.small esto no
; es un lujo: es la diferencia entre responder y arrastrarse.
opcache.enable = 1
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
; La imagen es inmutable —el código no cambia sin un despliegue nuevo—,
; así que no hace falta que OPcache compruebe fechas en cada petición.
opcache.validate_timestamps = 0

; ── Zona horaria ─────────────────────────────────────────────────────
date.timezone = America/Bogota
